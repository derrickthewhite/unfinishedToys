<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Cat Canvas Baseline</title>
    <style>
        :root {
            color-scheme: light;
            --paper: #f4efe3;
            --ink: #20180f;
            --accent: #d56f3e;
            --accent-soft: #f3c57a;
            --field: #d8e6c3;
            --field-deep: #9fb686;
            --panel: rgba(255, 250, 240, 0.82);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.55), transparent 32%),
                linear-gradient(180deg, #b9d5e7 0%, #f7e6b5 54%, #d0dfbc 100%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .app {
            width: min(1080px, 100%);
            display: grid;
            gap: 18px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(32, 24, 15, 0.15);
            border-radius: 18px;
            backdrop-filter: blur(10px);
            box-shadow: 0 18px 48px rgba(60, 42, 20, 0.18);
        }

        .toolbar {
            padding: 18px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px 18px;
            align-items: end;
        }

        .title {
            grid-column: 1 / -1;
        }

        h1 {
            margin: 0 0 6px;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            line-height: 1;
            letter-spacing: 0.03em;
        }

        p {
            margin: 0;
            font-size: 0.98rem;
            line-height: 1.4;
        }

        label {
            display: grid;
            gap: 6px;
            font-size: 0.9rem;
        }

        input,
        button,
        select {
            font: inherit;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .speed-readout {
            font-variant-numeric: tabular-nums;
            color: rgba(32, 24, 15, 0.75);
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 10px 16px;
            background: linear-gradient(180deg, var(--accent-soft), var(--accent));
            color: #fffaf2;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(213, 111, 62, 0.24);
        }

        button.secondary {
            background: linear-gradient(180deg, #82715e, #51463b);
            box-shadow: 0 10px 20px rgba(56, 46, 38, 0.18);
        }

        .canvas-shell {
            padding: 14px;
        }

        canvas {
            display: block;
            width: 100%;
            height: min(70vh, 720px);
            border-radius: 14px;
            background: linear-gradient(180deg, #cde9f9 0%, #f9e6a4 56%, #b9d39f 100%);
        }

        .status {
            padding: 0 20px 18px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 0.92rem;
            color: rgba(32, 24, 15, 0.78);
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .toolbar,
            .status {
                padding-left: 14px;
                padding-right: 14px;
            }

            .canvas-shell {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="panel toolbar">
            <div class="title">
                <h1>Walking Cat Baseline</h1>
                <p>Click anywhere on the canvas to set a destination. The cat rotates into that heading, walks in profile, and uses the CatHerder SVG portraits as face icons.</p>
            </div>

            <label>
                <span>Speed</span>
                <input id="speed" type="range" min="0" max="420" step="1" value="150">
                <span class="speed-readout" id="speedReadout">150 px/s</span>
            </label>

            <label>
                <span>Face</span>
                <select id="faceSelect"></select>
            </label>

            <div class="button-row">
                <button id="nextFace" type="button">Next Face</button>
                <button id="recenter" class="secondary" type="button">Recenter Cat</button>
            </div>
        </section>

        <section class="panel canvas-shell">
            <canvas id="scene" width="960" height="640"></canvas>
        </section>

        <section class="status">
            <span id="positionLabel">Position: 0, 0</span>
            <span id="targetLabel">Target: center</span>
            <span id="assetLabel">Loading CatHerder face SVGs...</span>
        </section>
    </main>

    <script>
        const faceAssets = [
            { label: "Angelpuss", src: "Angelpuss.svg" },
            { label: "Moash", src: "moash.svg" },
            { label: "Winry", src: "winry.svg" },
            { label: "Kaladin", src: "kaladin.svg" },
            { label: "Persephone", src: "persephone.svg" },
            { label: "Tiny", src: "tiny.svg" }
        ];

        const canvas = document.getElementById("scene");
        const ctx = canvas.getContext("2d");
        const speedInput = document.getElementById("speed");
        const speedReadout = document.getElementById("speedReadout");
        const faceSelect = document.getElementById("faceSelect");
        const nextFaceButton = document.getElementById("nextFace");
        const recenterButton = document.getElementById("recenter");
        const positionLabel = document.getElementById("positionLabel");
        const targetLabel = document.getElementById("targetLabel");
        const assetLabel = document.getElementById("assetLabel");

        const cat = {
            x: canvas.width * 0.5,
            y: canvas.height * 0.55,
            targetX: canvas.width * 0.5,
            targetY: canvas.height * 0.55,
            heading: 0,
            speed: Number(speedInput.value),
            gaitPhase: 0,
            bodyLength: 96,
            bodyHeight: 46,
            headRadius: 28,
            faceIndex: 0
        };

        let lastFrameTime = performance.now();

        const loadedFaces = faceAssets.map((asset) => {
            const image = new Image();
            const record = { ...asset, image, ready: false };
            image.addEventListener("load", () => {
                record.ready = true;
            });
            image.addEventListener("error", () => {
                record.ready = false;
            });
            image.src = asset.src;
            if (image.complete && image.naturalWidth > 0) {
                record.ready = true;
            }
            return record;
        });

        function populateFaceSelect() {
            faceSelect.innerHTML = "";
            loadedFaces.forEach((asset, index) => {
                const option = document.createElement("option");
                option.value = String(index);
                option.textContent = asset.label;
                faceSelect.appendChild(option);
            });
            faceSelect.value = String(cat.faceIndex);
        }

        function updateSpeedLabel() {
            cat.speed = Number(speedInput.value);
            speedReadout.textContent = `${cat.speed} px/s`;
        }

        function updateStatus() {
            positionLabel.textContent = `Position: ${cat.x.toFixed(0)}, ${cat.y.toFixed(0)}`;
            targetLabel.textContent = `Target: ${cat.targetX.toFixed(0)}, ${cat.targetY.toFixed(0)}`;
            const readyCount = loadedFaces.filter((asset) => asset.ready).length;
            assetLabel.textContent = `Faces ready: ${readyCount}/${loadedFaces.length}`;
        }

        function resizeCanvas() {
            const bounds = canvas.getBoundingClientRect();
            const displayWidth = Math.max(320, Math.floor(bounds.width));
            const displayHeight = Math.max(320, Math.floor(bounds.height));
            if (canvas.width === displayWidth && canvas.height === displayHeight) {
                return;
            }

            const previousWidth = canvas.width;
            const previousHeight = canvas.height;
            const ratioX = previousWidth ? displayWidth / previousWidth : 1;
            const ratioY = previousHeight ? displayHeight / previousHeight : 1;

            canvas.width = displayWidth;
            canvas.height = displayHeight;
            cat.x *= ratioX;
            cat.y *= ratioY;
            cat.targetX *= ratioX;
            cat.targetY *= ratioY;
        }

        function screenToCanvas(event) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (event.clientX - rect.left) * (canvas.width / rect.width),
                y: (event.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function setFace(index) {
            const normalizedIndex = (index + loadedFaces.length) % loadedFaces.length;
            cat.faceIndex = normalizedIndex;
            faceSelect.value = String(normalizedIndex);
        }

        function recenterCat() {
            cat.x = canvas.width * 0.5;
            cat.y = canvas.height * 0.55;
            cat.targetX = cat.x;
            cat.targetY = cat.y;
        }

        function updateCat(deltaSeconds) {
            const dx = cat.targetX - cat.x;
            const dy = cat.targetY - cat.y;
            const distance = Math.hypot(dx, dy);
            const hasDirection = distance > 0.001;

            if (hasDirection) {
                cat.heading = Math.atan2(dy, dx);
            }

            if (distance < 0.8 || cat.speed <= 0) {
                return;
            }

            const step = Math.min(distance, cat.speed * deltaSeconds);
            const ux = dx / distance;
            const uy = dy / distance;
            cat.x += ux * step;
            cat.y += uy * step;
            cat.gaitPhase += step * 0.12;
        }

        function drawBackdrop() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, "#c9e8f8");
            skyGradient.addColorStop(0.58, "#f6e4ae");
            skyGradient.addColorStop(1, "#a7c789");
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.globalAlpha = 0.12;
            ctx.strokeStyle = "#35523b";
            for (let x = 0; x <= canvas.width; x += 48) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += 48) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.lineTo(canvas.width, y + 8);
                ctx.stroke();
            }
            ctx.restore();

            ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
            ctx.beginPath();
            ctx.ellipse(canvas.width * 0.18, canvas.height * 0.14, 120, 44, -0.1, 0, Math.PI * 2);
            ctx.ellipse(canvas.width * 0.72, canvas.height * 0.2, 160, 54, 0.04, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawTarget() {
            ctx.save();
            ctx.translate(cat.targetX, cat.targetY);
            ctx.strokeStyle = "rgba(112, 46, 18, 0.7)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-20, 0);
            ctx.lineTo(20, 0);
            ctx.moveTo(0, -20);
            ctx.lineTo(0, 20);
            ctx.stroke();
            ctx.restore();
        }

        function drawLegPair(frontOffset, phaseOffset, color) {
            const stride = Math.sin(cat.gaitPhase + phaseOffset) * 14;
            const kneeLift = Math.cos(cat.gaitPhase + phaseOffset) * 4;
            const upperY = 18;
            const footBaseY = 48;

            ctx.strokeStyle = color;
            ctx.lineWidth = 6;
            ctx.lineCap = "round";

            ctx.beginPath();
            ctx.moveTo(frontOffset, upperY);
            ctx.lineTo(frontOffset + stride * 0.35, upperY + 14 - kneeLift);
            ctx.lineTo(frontOffset + stride, footBaseY);
            ctx.stroke();
        }

        function drawTail() {
            const swish = Math.sin(cat.gaitPhase * 0.55) * 0.25;
            ctx.strokeStyle = "#85553b";
            ctx.lineWidth = 10;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(-66, -10);
            ctx.bezierCurveTo(-94, -34 + swish * 24, -110, -58 + swish * 38, -96, -88 + swish * 42);
            ctx.stroke();
        }

        function drawFace() {
            const face = loadedFaces[cat.faceIndex];
            const faceSize = cat.headRadius * 3.4;

            if (face && face.ready) {
                ctx.drawImage(face.image, 38 - faceSize / 2, -22 - faceSize / 2, faceSize, faceSize);
            } else {
                ctx.fillStyle = "#f6efe4";
                ctx.beginPath();
                ctx.ellipse(38, -22, cat.headRadius, cat.headRadius - 2, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCat() {
            ctx.save();
            ctx.translate(cat.x, cat.y);
            ctx.rotate(cat.heading);

            if (Math.cos(cat.heading) < 0) {
                ctx.scale(1, -1);
            }

            ctx.fillStyle = "rgba(46, 28, 18, 0.15)";
            ctx.beginPath();
            ctx.ellipse(-4, 54, 68, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            drawTail();

            drawLegPair(-26, 0, "#7a5039");
            drawLegPair(8, Math.PI, "#7a5039");
            drawLegPair(-8, Math.PI, "#b57d59");
            drawLegPair(28, 0, "#b57d59");

            ctx.fillStyle = "#b57d59";
            ctx.strokeStyle = "#2b1f17";
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            ctx.ellipse(-8, 0, cat.bodyLength * 0.58, cat.bodyHeight * 0.58, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            drawFace();

            ctx.restore();
        }

        function render() {
            drawBackdrop();
            drawTarget();
            drawCat();
            updateStatus();
        }

        function frame(time) {
            resizeCanvas();
            const deltaSeconds = Math.min(0.05, (time - lastFrameTime) / 1000);
            lastFrameTime = time;
            updateCat(deltaSeconds);
            render();
            requestAnimationFrame(frame);
        }

        function attachEvents() {
            speedInput.addEventListener("input", updateSpeedLabel);
            faceSelect.addEventListener("change", () => {
                setFace(Number(faceSelect.value));
            });
            nextFaceButton.addEventListener("click", () => {
                setFace(cat.faceIndex + 1);
            });
            recenterButton.addEventListener("click", recenterCat);
            canvas.addEventListener("pointerdown", (event) => {
                const point = screenToCanvas(event);
                cat.targetX = point.x;
                cat.targetY = point.y;
            });
            window.addEventListener("resize", resizeCanvas);
        }

        function loadAssets() {
            populateFaceSelect();
            updateSpeedLabel();
        }

        loadAssets();
        attachEvents();
        resizeCanvas();
        render();
        requestAnimationFrame(frame);
    </script>
</body>
</html>

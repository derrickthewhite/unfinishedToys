	function cycleCount(edgeList){
		//console.log(edgeList)
		var result ={
			triangles:0,
			squares:0
		}
		for(var node = 0;node<10;node++){
			var firstLevel = edgeList.filter(edge => edge.indexOf(node)!=-1)
				.map(edge=>edge[0]==node?edge[1]:edge[0])
				.filter(a=> a>node);
			var secondLevel = firstLevel.map(n=>edgeList.filter(edge=> edge.indexOf(n)!=-1)
				.map(edge=>edge[0]==n?edge[1]:edge[0]))
				.reduce((a,b)=>a.concat(b),[])
				.filter(a=>a!=node && a>node);
				
			var opposingNodes = secondLevel.filter((node,index,array)=>array.indexOf(node)!=index);
			var tripleSquareStacks = opposingNodes.filter((node,index,array)=>array.indexOf(node)!=index);
			//check for both simple opposites and for triple shaped stacks (which will show up three times)
			var squares = opposingNodes.filter(node => tripleSquareStacks.indexOf(node)==-1).length+tripleSquareStacks.length*3
			result.squares += squares;
			result.triangles += secondLevel.filter(node=> firstLevel.indexOf(node)!=-1).length/2; //TODO: test this! not 100% sure!
			
			//console.log(node,firstLevel,secondLevel,result);
		}
		return result;
	}
	function adjacent(node,edgeList){
		return edgeList.filter(edge=>edge.indexOf(node)!=-1).map(edge => edge[0]==node?edge[1]:edge[0])
	}
	function isBipartite(edgeList){
		var redNodes =[0];
		var blueNodes = [];
		var nodesToProccess = [{node:0,color:"red"}];
		
		while(nodesToProccess.length!=0){
			var current = nodesToProccess.shift();
			var group = current.color=="red"?redNodes:blueNodes;
			var neighborGroup = current.color=="red"?blueNodes:redNodes;
			var neighborColor = current.color=="red"?"blue":"red";
			if(adjacent(current.node,edgeList).map(neighbor=>{
				if(group.indexOf(neighbor)!=-1) return false;
				if(neighborGroup.indexOf(neighbor)==-1) {
					neighborGroup.push(neighbor);
					nodesToProccess.push({node:neighbor,color:neighborColor});
				}
				return true;
			}).reduce((a,b)=>a&&b)==false) return false;
		}
		return true;
	}
	function girth(edgeList){ // is this the right concept? I think it is
		var girth = 0;
		for(var i = 0;i<10;i++){
			var nodesReached = [i];
			var nodesActive = [i];
			var count = 0;
			while(nodesReached.length < 10){
				nodesActive = nodesActive.map(node=>adjacent(node,edgeList)).reduce((a,b)=>a.concat(b)).filter((node,index,array)=>array.indexOf(node)==index);
				nodesReached = nodesReached.concat(nodesActive).filter((node,index,array)=>array.indexOf(node)==index); 
				count++
			}
			girth = Math.max(count,girth);
		}
		return girth;
	}
	
	function identifyGraph(graph){
		counts = cycleCount(graph);
		var result = graphCycleCounts.filter(shape=>shape.squares==counts.squares && shape.triangles == counts.triangles)[0];
		return result.distinguish?result.distinguish(graph):result.name;
	}
	
	function edgeCount(node,list){
		return list.filter(a=>a.indexOf(node)!=-1).length
	}
	function edgeIn(edge,list){
		return list.filter(
			a=> (a[0]==edge[0] && a[1]==edge[1]) || (a[1]==edge[0] && a[0]==edge[1])
		).length>=1
	}
	
	function buildGraph(baseString){
		var inputs = baseString.split("");
		var invalidPairs = Array(11).fill([]);
		var edgeList = ([]).concat(config.initialPairList);
		var loopCount;
		while(edgeList.length <15){
			var lastPair = edgeList[edgeList.length-1];
			var source = (lastPair[0]+1)%10
			var destination = (lastPair[1]+1)%10
			while(edgeCount(source,edgeList)==3) source = (source+1)%10;
			loopCount = 0;
			var destinationSkips = 0;
			var addEdge = true;
			while(edgeCount(destination,edgeList)==3
				|| destination == source
				|| edgeIn([source,destination],edgeList)
				|| edgeIn([source,destination],invalidPairs[edgeList.length-4])
				|| (destinationSkips++ == 0 && baseString[edgeList.length-4]=="1") // TODO: let this line reset loop count
			){
				if( loopCount > 20){
					invalidPairs[edgeList.length-4] = []; //clear invalid pairs for next pair
					invalidPairs[edgeList.length-4-1].push(edgeList.pop());
					//console.log("pop",lastPair[0],lastPair[1]);
					addEdge=false;
					break;
				}
				destination = (destination+1)%10;
				loopCount+=1;
			}
			if(addEdge){
				edgeList.push([source,destination]);
				//console.log("add",source,destination);
			}
		}
		return edgeList;
	}
	
	function numToBinString(dec){
		var base =  (dec >>> 0).toString(2);
		return Array(10-base.length).fill("0").reduce((a,b)=>a+b,"") +base;
	}

		}
		return testConfig();
	}
	
	function testConfig(){
		var score = [];

		for(var i = 0;i<1024;i++){
			
			var id = numToBinString(i);

			var name = identifyGraph(graph);
			if(!score[name]) 
			{	
				score[name]=0;
				typeNames.push(name)
			}
			score[name]++;
			//console.log(id,graph,name);
		}
		var leftOut = graphCycleCounts.map(a=>a.distinguish?a.name.split("|"):[a.name]).reduce((a,b)=>a.concat(b)).filter(shape=>typeNames.indexOf(shape)==-1);
		return{
			score:score,
			typeNames:typeNames,
			leftOut:leftOut,
			minimumPopulation:typeNames.map(type=>score[type]).reduce((a,b) => Math.min(a,b)),
			validGraph:leftOut.length ==2 && leftOut.filter(name => name!="Pyramid + Prism" && name!="Pyramid + M-Prism").length==0
		};
	}

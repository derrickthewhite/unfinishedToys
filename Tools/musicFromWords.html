<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Music</title>
    <style>
        #noteDisplay {
            margin-top: 20px;
            font-size: 20px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Text to Music Converter</h1>
    <textarea id="textInput" rows="10" cols="50" placeholder="Enter text here..."></textarea><br>
    <select id="playMode">
        <option value="single">Single Note</option>
        <option value="double">Double Notes</option>
    </select>
    <button onclick="playSong()">Play Song</button>

    <div id="noteDisplay"></div>

    <script>
        const noteFrequencies = {
            'a': 440.00, // A4
            'b': 493.88, // B4
            'c': 261.63, // C4
            'd': 293.66, // D4
            'e': 329.63, // E4
            'f': 349.23, // F4
            'g': 392.00, // G4
            'h': 440.00, // A4
            'i': 493.88, // B4
            'j': 261.63, // C4
            'k': 293.66, // D4
            'l': 329.63, // E4
            'm': 349.23, // F4
            'n': 392.00, // G4
            'o': 440.00, // A4
            'p': 493.88, // B4
            'q': 261.63, // C4
            'r': 293.66, // D4
            's': 329.63, // E4
            't': 349.23, // F4
            'u': 392.00, // G4
            'v': 440.00, // A4
            'w': 493.88, // B4
            'x': 261.63, // C4
            'y': 293.66, // D4
            'z': 329.63  // E4
        };

        const noteNames = {
            'a': 'A4',
            'b': 'B4',
            'c': 'C4',
            'd': 'D4',
            'e': 'E4',
            'f': 'F4',
            'g': 'G4',
            'h': 'A4',
            'i': 'B4',
            'j': 'C4',
            'k': 'D4',
            'l': 'E4',
            'm': 'F4',
            'n': 'G4',
            'o': 'A4',
            'p': 'B4',
            'q': 'C4',
            'r': 'D4',
            's': 'E4',
            't': 'F4',
            'u': 'G4',
            'v': 'A4',
            'w': 'B4',
            'x': 'C4',
            'y': 'D4',
            'z': 'E4'
        };

        function playSong() {
            const textInput = document.getElementById('textInput').value.toLowerCase();
            const playMode = document.getElementById('playMode').value;
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const noteDisplay = document.getElementById('noteDisplay');
            noteDisplay.innerHTML = ''; // Clear previous notes display
            let currentTime = audioCtx.currentTime;

            if (playMode === 'double') {
                for (let i = 0; i < textInput.length; i += 2) {
                    const char1 = textInput[i];
                    const char2 = textInput[i + 1];
                    if (noteFrequencies[char1] && noteFrequencies[char2]) {
                        displayNotes(char1, char2);
                        playNotePair(audioCtx, noteFrequencies[char1], noteFrequencies[char2], currentTime);
                        currentTime += 0.5; // Play next note pair after 0.5 seconds
                    } else if (noteFrequencies[char1]) {
                        displayNotes(char1, null);
                        playNotePair(audioCtx, noteFrequencies[char1], 0, currentTime);
                        currentTime += 0.5; // Play next note after 0.5 seconds
                    }
                }
            } else {
                for (let i = 0; i < textInput.length; i++) {
                    const char = textInput[i];
                    if (noteFrequencies[char]) {
                        displayNotes(char, null);
                        playSingleNote(audioCtx, noteFrequencies[char], currentTime);
                        currentTime += 0.5; // Play next note after 0.5 seconds
                    }
                }
            }
        }

        function playNotePair(audioCtx, frequency1, frequency2, startTime) {
            // First note
            const oscillator1 = audioCtx.createOscillator();
            const gainNode1 = audioCtx.createGain();
            oscillator1.connect(gainNode1);
            gainNode1.connect(audioCtx.destination);
            oscillator1.type = 'sine';
            oscillator1.frequency.setValueAtTime(frequency1, audioCtx.currentTime);
            oscillator1.start(startTime);
            oscillator1.stop(startTime + 0.5);

            // Second note if frequency2 is not zero
            if (frequency2 !== 0) {
                const oscillator2 = audioCtx.createOscillator();
                const gainNode2 = audioCtx.createGain();
                oscillator2.connect(gainNode2);
                gainNode2.connect(audioCtx.destination);
                oscillator2.type = 'sine';
                oscillator2.frequency.setValueAtTime(frequency2, audioCtx.currentTime);
                oscillator2.start(startTime);
                oscillator2.stop(startTime + 0.5);
            }
        }

        function playSingleNote(audioCtx, frequency, startTime) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            oscillator.start(startTime);
            oscillator.stop(startTime + 0.5);
        }

        function displayNotes(char1, char2) {
            const noteDisplay = document.getElementById('noteDisplay');
            if (char2) {
                noteDisplay.innerHTML += `${noteNames[char1]}-${noteNames[char2]} `;
            } else {
                noteDisplay.innerHTML += `${noteNames[char1]} `;
            }
        }
    </script>
</body>
</html>

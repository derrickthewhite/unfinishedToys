<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Auth Export Demo</title>
	<style>
		:root {
			color-scheme: light;
			font-family: "Segoe UI", sans-serif;
			background: #f2efe8;
			color: #1e2228;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background:
				radial-gradient(circle at top, rgba(214, 160, 84, 0.22), transparent 28%),
				linear-gradient(180deg, #f8f4ec 0%, #ece5d7 100%);
		}

		main {
			max-width: 960px;
			margin: 0 auto;
			padding: 32px 20px 48px;
		}

		h1 {
			font-size: 2.4rem;
			margin: 0 0 8px;
		}

		p {
			line-height: 1.5;
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
			gap: 20px;
			margin-top: 24px;
		}

		.card {
			background: rgba(255, 255, 255, 0.82);
			backdrop-filter: blur(8px);
			border: 1px solid rgba(30, 34, 40, 0.12);
			border-radius: 18px;
			padding: 20px;
			box-shadow: 0 14px 36px rgba(53, 42, 24, 0.12);
		}

		label {
			display: block;
			font-weight: 600;
			margin: 12px 0 6px;
		}

		input,
		button,
		textarea {
			font: inherit;
		}

		input {
			width: 100%;
			box-sizing: border-box;
			padding: 10px 12px;
			border-radius: 10px;
			border: 1px solid #cdbda4;
			background: #fffdf9;
		}

		button {
			margin-top: 16px;
			padding: 10px 14px;
			border: 0;
			border-radius: 999px;
			background: #b45d2f;
			color: white;
			cursor: pointer;
		}

		button.secondary {
			background: #425466;
		}

		button + button {
			margin-left: 10px;
		}

		.status {
			min-height: 24px;
			margin-top: 12px;
			font-size: 0.95rem;
		}

		.status.ok {
			color: #1f6f43;
		}

		.status.error {
			color: #a1312b;
		}

		pre {
			background: #201b16;
			color: #f4ead8;
			padding: 14px;
			border-radius: 12px;
			overflow: auto;
			min-height: 180px;
		}

		.current-user {
			font-weight: 700;
			margin-top: 12px;
		}
	</style>
</head>
<body>
	<main>
		<h1>Auth Export</h1>
		<p>This page uses the exported SRP auth bundle only. It does not depend on any game, icon, or gameplay code.</p>
		<div class="current-user" id="current-user">Checking session...</div>

		<div class="grid">
			<section class="card">
				<h2>Create Account</h2>
				<form id="signup-form">
					<label for="signup-username">Username</label>
					<input id="signup-username" type="text" autocomplete="username">

					<label for="signup-password">Password</label>
					<input id="signup-password" type="password" autocomplete="new-password">

					<label for="signup-invite-key">Invite Key</label>
					<input id="signup-invite-key" type="password" autocomplete="off">

					<button type="submit">Create Account</button>
					<div class="status" id="signup-status"></div>
				</form>
			</section>

			<section class="card">
				<h2>Sign In</h2>
				<form id="signin-form">
					<label for="signin-username">Username</label>
					<input id="signin-username" type="text" autocomplete="username">

					<label for="signin-password">Password</label>
					<input id="signin-password" type="password" autocomplete="current-password">

					<div>
						<button type="submit">Sign In</button>
						<button type="button" class="secondary" id="signout-button">Sign Out</button>
					</div>

					<div class="status" id="signin-status"></div>
				</form>
			</section>

			<section class="card">
				<h2>Diagnostics</h2>
				<p>Use this to confirm database access, session naming, and invite-key configuration.</p>
				<button type="button" class="secondary" id="diagnostics-button">Run Auth Test</button>
				<pre id="diagnostics-output"></pre>
			</section>
		</div>
	</main>
	<script type="module" src="./js/app.js"></script>
</body>
</html>

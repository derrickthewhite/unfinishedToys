	<script>
		function genMaze(x,y) {
			var n=x*y-1;
			if (n<0) {alert("illegal maze dimensions");return;}
			var horiz=[]; for (var j= 0; j<x+1; j++) horiz[j]= [];
			var verti=[]; for (var j= 0; j<y+1; j++) verti[j]= [];
			var here= [Math.floor(Math.random()*x), Math.floor(Math.random()*y)];
			var path= [here];
			var unvisited= [];
			for (var j= 0; j<x+2; j++) {
				unvisited[j]= [];
				for (var k= 0; k<y+1; k++)
					unvisited[j].push(j>0 && j<x+1 && k>0 && (j != here[0]+1 || k != here[1]+1));
			}
			while (0<n) {
				var potential= [[here[0]+1, here[1]], [here[0],here[1]+1],
					[here[0]-1, here[1]], [here[0],here[1]-1]];
				var neighbors= [];
				for (var j= 0; j < 4; j++)
					if (unvisited[potential[j][0]+1][potential[j][1]+1])
						neighbors.push(potential[j]);
				if (neighbors.length) {
					n= n-1;
					next= neighbors[Math.floor(Math.random()*neighbors.length)];
					unvisited[next[0]+1][next[1]+1]= false;
					if (next[0] == here[0])
						horiz[next[0]][(next[1]+here[1]-1)/2]= true;
					else 
						verti[(next[0]+here[0]-1)/2][next[1]]= true;
					path.push(here= next);
				} else 
					here= path.pop();
			}
			return ({x: x, y: y, horiz: horiz, verti: verti});
		}

		function display(m) {
			var text= [];
			for (var j= 0; j<m.x*2+1; j++) {
				var line= [];
				if (0 == j%2)
					for (var k=0; k<m.y*4+1; k++)
						if (0 == k%4) 
							line[k]= '+';
						else
							if (j>0 && m.verti[j/2-1][Math.floor(k/4)])
								line[k]= ' ';
							else
								line[k]= '-';
				else
					for (var k=0; k<m.y*4+1; k++)
						if (0 == k%4)
							if (k>0 && m.horiz[(j-1)/2][k/4-1])
								line[k]= ' ';
							else
								line[k]= '|';
						else
							line[k]= ' ';
				if (0 == j) line[1]= line[2]= line[3]= ' ';
				if (m.x*2-1 == j) line[4*m.y]= ' ';
				text.push(line.join('')+'\r\n');
			}
			console.log(text.join(''));
			
			return text.join('');
		}

		function protagonistDeath() {

		function getHighestValuesByType(arr) {
			// Create an empty object to track the highest value for each type
			const highestByType = {};

			// Iterate over each object in the array
			arr.forEach(item => {
				const { type, value } = item;

				// If the type is not in the object, or if the current value is higher, update it
				if (!highestByType[type] || value > highestByType[type].value) {
					highestByType[type] = item;
				}
			});

			// Convert the highestByType object back into an array
			return Object.values(highestByType);
		}
		function calculateCharacterCombat(attacker, defender) {
			var atkWeapons = (attacker.resources? attacker.resources.filter(weapon => weapon.weaponDamage && !weapon.weaponType.includes("armor")).map(weapon => ({
				value : weapon.weaponDamage,
				type: weapon.weaponType? weapon.weaponType: "physical"
			})): []).concat([{
				type: "none",
				value: 0
			}]);
			atkWeapons = getHighestValuesByType(atkWeapons);
			
			var defWeapons = (defender.resources? defender.resources.filter(weapon => weapon.weaponDamage && !weapon.weaponType.includes("armor")).map(weapon => ({
				value : weapon.weaponDamage,
				type: weapon.weaponType? weapon.weaponType: "physical"
			})): []).concat([{
				type: "none",
				value: 0
			}]);
			defWeapons = getHighestValuesByType(atkWeapons);
			
			var atkArmors = (attacker.resources? attacker.resources.filter(weapon => weapon.weaponDamage && weapon.weaponType.includes("armor"))
			.map(a => ({
				type: a.weaponType.split("-")[0],
				value: a.weaponDamage
			})):[]).concat([{
				type: "none",
				value: 0
			}]);
			atkArmors = getHighestValuesByType(defArmors);
			
			var defArmors = (defender.resources? defender.resources.filter(weapon => weapon.weaponDamage && weapon.weaponType.includes("armor"))
			.map(a => ({
				type: a.weaponType.split("-")[0],
				value: a.weaponDamage
			})):[]).concat([{
				type: "none",
				value: 0
			}]);
			defArmors = getHighestValuesByType(defArmors);

			atkWeapons.map(atkWeapon => {
				var attackerDamageType = attacker.damageType? attacker.damageType : "physical";
				if(weapon.type == "none") weapon.type = attackerDamageType;

			
				var defArmor = defArmors.find(armor=> attackerDamageType == armor.type);
				defArmor = defArmor? defArmor.value: 0;

			});
		}
		function getBaseDamage(attacker, defender) {
			var atkWeapons = (attacker.resources? attacker.resources.filter(weapon => weapon.weaponDamage && !weapon.weaponType.includes("armor")).map(weapon => ({
				value : weapon.weaponDamage,
				type: weapon.weaponType? weapon.weaponType: "physical"
			})): []).concat([{
				type: "none",
				value: 0
			}]);
			atkWeapons = getHighestValuesByType(atkWeapons);
			
			var defArmors = (defender.resources? defender.resources.filter(weapon => weapon.weaponDamage && weapon.weaponType.includes("armor"))
			.map(a => ({
				type: a.weaponType.split("-")[0],
				value: a.weaponDamage
			})):[]).concat([{
				type: "none",
				value: 0
			}]);
			defArmors = getHighestValuesByType(defArmors);
			
			//TODO: filter ignores
			
			var attacks =  atkWeapons.map(weapon => {
				var hearts = attacker.hearts;
				var attackerDamageType = attacker.damageType? attacker.damageType : "physical";
				if(weapon.type == "none") weapon.type = attackerDamageType;
				if(defender.ignores && defender.ignores.includes(attackerDamageType)) {
					hearts = 0;
				}
				var mainArmor = defArmors.find(armor=> attackerDamageType == armor.type);
				var mainArmorValue = mainArmor? mainArmor.value: 0;
				
				if(hearts > mainArmorValue){
					hearts = hearts-mainArmorValue;
					mainArmorValue = 0;
				}
				else {
					hearts = 0;
					mainArmorValue = mainArmorValue-hearts;
				}
				hearts += weapon.value;
				if(weapon.type == weapon.type){
					if(hearts> mainArmorValue) {
						hearts = hearts - mainArmorValue;
						mainArmorValue = 0;
					} else {
						hearts = 0;
					}
				} else {
					var weaponArmor = defArmors.find(armor => armor.type == weapon.type);
					var weaponArmorValue = weaponArmor? weaponArmor.value: 0;
					if(hearts> weaponArmorValue) {
						weaponArmorValue = 0;
						hearts = hearts - weaponArmorValue;
					} else {
						hearts = 0;
					}
				}
				weapon.damage = hearts;
				return weapon;
			})
			
			attacks = attacks.sort((a,b) => {
				return b.damage - a.damage;
			});
			return attacks [0]
		}
		function getDamage(attacker,defender){
			var result = attacker.hearts;
			if(!defender.ignores || !defender.ignores.includes("phsyical")){
				result += getArmor(attacker);
			}
			result -= getArmor(defender)
			return Math.max(0,result);
		}

		function hasDamageType (unit, damageType) {
			return (unit.damageTypes && unit.damageTypes.includes (damageType))
			|| (unit.resources && unit.resources.length != 0 || character.resources.includes(i => i.weaponType == damageType))
		}
		function runCollision(character,collision) {
			if(collision.loyalty != "object" && collision.loyalty!= character.loyalty){
				if(collision.loyalty == "hazard" && character.ignores && character.ignores.includes(collision.damage)) {
					return;
				}
				if(collision.name == "Fire"){
					if(character.resources && character.resources.filter(r => r.name == "Bucket").length > 0){
						var bucket = character.resources.filter(r => r.name == "Bucket")[0];
						bucket.name = "Empty Bucket";
						bucket.icon = "assets/EmptyBucket.svg"
						collision.loyalty= "object";
						collision.hearts =0;
						collision.name = "Ashheap";
						collision.icon = "assets/Ashheap.svg"
						return;
					}
				}
				if(collision.name == "Web"){
					if(character.resources && character.resources.filter(r => r.name == "Torch").length > 0){
						collision.loyalty= "object";
						collision.hearts =0;
						collision.name = "Ashheap";
						collision.icon = "assets/Ashheap.svg"
						return;
					}
				}
				
				//TODO: Maybe refactor this?
				if(character.vulnerable && character.vulnerable.includes("water") && collision.resources && collision.resources.filter(r => r.name == "Bucket").length){
						var bucket = collision.resources.filter(r => r.name == "Bucket")[0];
						bucket.name = "Empty Bucket";
						bucket.icon = "assets/EmptyBucket.svg"
						character.loyalty= "object";
						character.hearts =0;
						character.name = "Ashheap";
						character.icon = "assets/Ashheap.svg"
						characters.splice(characters.indexOf(character),1);
						objects.push(character);
						return;
				}
				if(collision.vulnerable && collision.vulnerable.includes("water") && character.resources && character.resources.filter(r => r.name == "Bucket").length){
						var bucket = character.resources.filter(r => r.name == "Bucket")[0];
						bucket.name = "Empty Bucket";
						bucket.icon = "assets/EmptyBucket.svg"
						collision.loyalty= "object";
						collision.hearts =0;
						collision.name = "Ashheap";
						collision.icon = "assets/Ashheap.svg"
						characters.splice(characters.indexOf(collision),1);
						objects.push(collision);

						return;
				}
			
				var characterDamage = getDamage(character, collision)//Math.max(0,character.hearts + getArmor(character) - getArmor(collision));
				var collisionDamage = getDamage(collision, character)//Math.max(0,collision.hearts + getArmor(collision) - getArmor(character));
				//TODO: swords and shields should not protect from fire
				if(character.loyalty!= "hazard" && !(character.ignores && character.ignores.includes("physical")))
					character.hearts -= collisionDamage;
				if(collision.loyalty!= "hazard" && !(collision.ignores && collision.ignores.includes("physical")))
					collision.hearts -= characterDamage;
					
				
				//TODO: check for damage types instead
				if(character.hearts <= 0) {
					characters = characters.filter(c => c!=character);
					objects = objects.filter(o => o!=character);
					character.loyalty= "object";
					character.icon = "assets/Skull.svg";
					if(character.regenerates && !hasDamageType(collision, "fire"))character.icon = "assets/SkullRegen.svg"
					if(character.regenerates && hasDamageType(collision, "fire")) character.regenerates = false;
					objects.push(character);
				}
				if(collision.hearts <= 0) {
					characters = characters.filter(c => c!=collision);
					objects = objects.filter(o => o!=collision);
					collision.loyalty= "object";
					collision.icon = "assets/Skull.svg";
					if(collision.regenerates && !hasDamageType(character, "fire"))collision.icon = "assets/SkullRegen.svg"
					if(collision.regenerates && hasDamageType(character, "fire"))collision.regenerates = false
					objects.push(collision);
				}
				if(protagonist.hearts <= 0) {
					protagonistDeath();
				}
			}
		}
		function move(character,dir) {
			var y = character.y
			var x = character.x;
			var newLocation = wallMove(x, y,dir);
			if(!newLocation){
				newLocation= doors.map(door=> doorMove(x,y,dir,door)).filter(m => m)[0];
				if(!newLocation) return false;
				if(!(newLocation.door.open == true) &&
					//!(character.doors.includes(newLocation.door))&&
					!(character.resources && character.resources.filter(r=>r.name == "Key").length && newLocation.door.name == "locked Door" ) &&
					!(character.resources && character.resources.filter(r => r.name == "Pick").length > 0 && newLocation.door.name == "weak wall")){
						return false;
					}
			}
			newLocation.collisions= [];
			for(var collision of characters) {
				if(newLocation.x == collision.x && newLocation.y == collision.y){
					newLocation.collisions.push(collision);
				}
			}
			for(var collision of objects) {
				if(newLocation.x == collision.x && newLocation.y == collision.y){
					newLocation.collisions.push(collision);
				}
			}
			return newLocation;
		}
		function wallMove(x,y,direction) {
			//keep in case the composite function is wrong
			tX = Math.floor(x/9);
			tY = Math.floor(y/9);
			let maze = mazes[tX][tY];
			x = x - tX*9;
			y=y -tY*9;
			switch(direction) {
				case "Up": return (maze.verti[y-1] && maze.verti[y-1][x])? {x:x +tX*9, y:y-1+tY*9}: false;
				case "Down": return (maze.verti[y][x])? {x:x +tX*9, y:y+1+tY*9}: false;
				case "Left": return (maze.horiz[y][x-1])? {x:x-1 +tX*9, y:y+tY*9}: false;
				case "Right": return (maze.horiz[y][x])? {x:x+1+tX*9, y:y+tY*9}: false;
			}
			throw new Error("direction was wrong!");
			//getWallValue(getWall(x,y,direction));
		}
		function doorMove(x,y,dir, door) {
				if(door.orient == "verti") {
					if(x == door.x && y == door.y && dir == "Down") return {x:x, y: y+1, door: door};
					if(x == door.x && y == door.y+1 && dir == "Up") return {x:x, y: y-1, door: door};
				}
				if(door.orient == "horiz") {
					if(x == door.x && y == door.y && dir == "Right") return {x:x+1, y: y, door: door};
					if(x == door.x+1 && y == door.y && dir == "Left") return {x:x-1, y: y, door: door};
				}
				return false;
		}
		function getWall(x,y,direction) {
			switch(direction) {
				case "Up": return {x:x, y: y-1, orient: "verti"};
				case "Down": return {x:x, y: y, orient: "verti"};
				case "Left": return {x:x-1, y: y, orient: "horiz"};
				case "Right": return {x:x, y: y, orient: "horiz"};
			}
			throw new Error("direction was wrong!");
		}
		function getWallValue (x,y,orient){
			if(x.x !== undefined) return getWallValue(x.x, x.y, x.orient);
			tX = Math.floor(x/9);
			tY = Math.floor(y/9);
			if(mazes[tX] == undefined) return undefined;
			let maze = mazes[tX][tY];
			x = x - tX*9;
			y=y -tY*9;
			if(maze === undefined) return undefined; // spot is outside of maze zone
			if(maze[orient] == undefined) throw new Error ("orient does not exist", orient);
			if(maze[orient][y] === undefined) return undefined;
			return maze[orient][y][x]

		}
		function rotateMaze(maze) {
			var newMaze = {
				x: maze.x,
				y: maze.y,
				horiz: [],
				verti: []
			}
			for(var i = 0;i< newMaze.y+1;i++) newMaze.horiz.push([]);
			for(var i = 0;i< newMaze.y+1;i++) newMaze.verti.push([]);
			
			for(var longSide = 0;longSide< newMaze.x; longSide++){
					for(var shortSide = 0; shortSide < newMaze.x-1; shortSide++){
						newMaze.horiz[newMaze.x - longSide -1][shortSide] = maze.verti [shortSide] [longSide]
						newMaze.verti[newMaze.x - shortSide -2][longSide] = maze.horiz [longSide] [shortSide]
					}
				}
			return newMaze;
		}
		function rotateFloater(floater,mazeX, mazeY) {
			if(Math.floor(floater.x/9) == mazeX && Math.floor(floater.y/9) == mazeY){
				let x = floater.x - mazeX*9;
				let y = floater.y - mazeY*9;
				
				floater.x = y + mazeX*9;
				floater.y = (9 -1 - x) + mazeY*9;
			}
		}
		function rotateDoor(door, mazeX, mazeY) {
			if(Math.floor(door.x/9) == mazeX && Math.floor(door.y/9) == mazeY){
				let x = door.x - mazeX*9;
				let y = door.y - mazeY*9;
				
				if(door.orient == "verti"){
					if(y == 9-1) return;
					door.x = y + mazeX*9;
					door.y = (9 -1 - x) + mazeY*9;
					door.orient = "horiz"
				}
				else {
					if(x == 9-1) return;
					door.x = y + mazeX*9;
					door.y = (9 -2 - x) + mazeY*9;
					door.orient =  "verti";
				}
			}
		}
		function randomUnobstructedLocation () {
			var coords = {
				x: Math.floor(Math.random()*18),
				y: Math.floor(Math.random()*18)
			};
			while(characters.concat(objects).filter(obstruction => obstruction.x== coords.x && obstruction.y==coords.y).length){
				coords.x = Math.floor(Math.random()*18);
				coords.y = Math.floor(Math.random()*18);
			}
			return coords;
		}
		function randomUnobstructedQuadrantLocation (x,y) {
			var coords = {
				x: Math.floor(Math.random()*9)+x*9,
				y: Math.floor(Math.random()*9)+y*9
			};
			while(characters.concat(objects).filter(obstruction => obstruction.x== coords.x && obstruction.y==coords.y).length){
				coords.x = Math.floor(Math.random()*9)+x*9;
				coords.y = Math.floor(Math.random()*9)+y*9;
			}
			return coords;
		}
		function filterMoves(moves, character) {
			return moves.filter(m => m.collisions.filter(c=> c.loyalty == "hazard" 
			&& (!character.ignores || !character.ignores.includes(c.damage))).length == 0);
		}
		function NPCTurn (){
			for(var character of characters) {
				if(character.name != "protagonist"){
					var moves = ["Up","Down","Left","Right"]
						.map(dir=> move(character, dir))
						.filter(m => m);
					//moves = moves.filter(m => m.collisions.filter(c=> c.loyalty == "hazard").length == 0);
					moves = filterMoves(moves, character);
					if(moves.length!=1){
						moves = moves.filter(m => m.x!= character.lastX || m.y != character.lastY);
					}
					var moveToMake = moves[Math.floor(Math.random()*moves.length)];
					if(moveToMake == undefined) continue; // usually because they're trapped in a path
					character.lastX = character.x;
					character.lastY = character.y;
					character.x = moveToMake.x;
					character.y = moveToMake.y;

					for(collision of moveToMake.collisions) {
						runCollision(character, collision);
					}
				}
			}
			objects.filter(object => object.regenerates).forEach(object => {
				object.hearts++;
				if(object.hearts== object.maxHearts){
					objects.splice(objects.indexOf(object),1)
					object.loyalty = object.liveLoyalty;
					object.icon = object.liveIcon;
					characters.push(object);
				}
			});
			draw();
		}

		function getArmor(character) {
			if(!(character.resources)) return 0;
			return (character.resources.filter(r => r.name == "Sword").length? 1:0)
			+(character.resources.filter(r => r.name == "Torch").length? 1:0)
			+(character.resources.filter(r => r.name == "Shield").length? 1:0);
		}
		function restart() {
			protagonist.score = 0;
			protagonist.resources= [];
			protagonist.ignores= [];
			setUp();
		}
		function setUp(levelName){
			mazes = [
				[genMaze(9,9), genMaze(9,9)],
				[genMaze(9,9), genMaze(9,9)],
			];
			objects = [];
			doors = [];
			characters = [];
			protagonist.hearts = protagonist.maxHearts;
			//protagonist.resources = []; // maybe don't clear resources now?
			populateMaze(levelName);
			protagonist.icon = "assets/protagonist.svg"
			mode = "walk";
			draw();
		}
		function showDescription(description){
			document.getElementById("descriptionOverlay").style.display = "";
			document.getElementById("description").innerHTML = description;
		}
		function hideDescription(){
			document.getElementById("descriptionOverlay").style.display = "none";
		}
		function dropObject(object) {
			objects.push(object);
			protagonist.resources.splice(protagonist.resources.indexOf(object),1);
			object.x = protagonist.x;
			object.y = protagonist.y;
			document.getElementById("dropItems").style.display = "none";
			mode = "walk";
			NPCTurn();
			draw();
		}
		let mazes = [];
		let characters = [];
		let doors = [];
		let objects = [];
		let protagonist;
		let mode = "walk";
		function main() {
			//Math.seedrandom("dragon");
			mazes = [
				[genMaze(9,9), genMaze(9,9)],
				[genMaze(9,9), genMaze(9,9)],
			];
			
			populateMaze();
			
			document.addEventListener("keydown", (event) => {
				if(mode !="walk")return;
				var character = characters[0];
				if(["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(event.code)){
					var dir = event.code.replace("Arrow","");
					var newLocation = move(character,dir);
					if(newLocation){
						var x = protagonist.x
						var y = protagonist.y
						characters[0].x = newLocation.x;
						characters[0].y = newLocation.y;
						if(newLocation.door && newLocation.door.name == "weak wall"){
							doors.filter(door=> doorMove(x,y,dir,door) && door.name == "weak wall").forEach(door => {
								door.name = "broken wall";
								door.icon = "assets/BrokenWall.svg";
								door.open = true;
								
								var x = door.x;
								var y = door.y;
								tX = Math.floor(x/9);
								tY = Math.floor(y/9);
								if(mazes[tX] == undefined) return undefined;
								let maze = mazes[tX][tY];
								x = x - tX*9;
								y=y -tY*9;
								maze[door.orient][y][x] = true;
							})
						}
						if(newLocation.collisions.length) {
							for(collision of newLocation.collisions) {
								runCollision(protagonist,collision);
							}
						}
						draw();
						//TODO: diable click during NPC move?
						// OR just run it early
						NPCTurn();
					}
				}
				if(event.code == "Space"){
					for(var object of objects) {
						if(object.x == character.x && object.y == character.y) {
							if(object.name == "Lever") {
								//rotate code
								mazes[object.maze.x][object.maze.y]= rotateMaze(mazes[object.maze.x][object.maze.y]);
								var maze = mazes[object.maze.x][object.maze.y];
								for(let rchar of characters)rotateFloater(rchar, object.maze.x, object.maze.y)
								for(let robj of objects)rotateFloater(robj, object.maze.x, object.maze.y)
								for(let rdoor of doors)rotateDoor(rdoor, object.maze.x, object.maze.y)
								
								NPCTurn();
								draw();
							}
							if(object.name == "Chest"){
								//protagonist.resources= protagonist.resources.concat(object.contents);
								//object.contents = [];
								protagonist.score++;
								object.icon = "assets/OpenChest.svg";
								object.name = "Opened Chest";
								object.description = "There used to be treasure here!";

								NPCTurn();
								draw();
							}
							if(object.name == "Well"){
								protagonist.resources.filter(r => r.name == "Empty Bucket")
									.forEach(r =>  {
										r.name = "Bucket";
										r.icon = "assets/Bucket.svg"
									})
								NPCTurn();
								draw();
							}
							if(object.resource == true){
								objects = objects.filter(o => o!== object);
								protagonist.resources.push(object);
								if(protagonist.resources.length > config.itemLimit){
									document.getElementById("itemsToDrop").innerHTML =""
									for(let resource of protagonist.resources){
										let image = document.createElement("img");
										image.src = resource.icon;
										image.onclick = () =>  {dropObject(resource)};
										document.getElementById("itemsToDrop").appendChild(image);
									}
									document.getElementById("dropItems").style.display = "";
									mode = "pause";
								}else {
									NPCTurn();
									draw();
								}
							}
							if(object.name == "Potion") {
								protagonist.hearts = Math.max(protagonist.maxHearts, protagonist.hearts+1);
								objects = objects.filter(o => o!== object);
								NPCTurn();
								draw();
							}
							if(object.name == "Stairs") {
								setUp(object.destination);
							}
						}
					}
				}
			})
			//document.getElementById("textMaze").innerHTML= display(maze);
			
			draw();
		}
    </script>
</head>
<body onload="main()">
    <!--pre id="textMaze">
	</pre-->
	<div id="ULMaze" class="maze"> 
	</div>
	<div id="URMaze" class="maze"> 
	</div>
	<br>
	<div id="LLMaze" class="maze"> 
	</div>
	<div id="LRMaze" class="maze"> 
	</div>
	<div id="inventory"></div>
	<div id="dropItems" class = "modal" style="display:none">
		<div >You must drop one of the following items:</div>
		<div id="itemsToDrop"></div>
	</div>
	<div id="gameOver" style="display:none" class = "modal">
		<img src= "assets/Skull.svg"><img>
		<div >You are Dead</div>
		<div >Your Score is : <span id ="score">0</span></div>
		<button onclick="restart()">Restart</button>
	</div>
	<div id="descriptionOverlay" style="display:none" onclick="hideDescription()">
		<div id="description"></div>
	</div>

</body>
</html>

		function d6() {
			return Math.floor(Math.random()*6)+1;
		}
		function explode6(dice) {
			result = 0;
			for(var i = 0;i<dice;i++){
				var roll = d6();
				result += roll + (roll == 6? explode6(1): 0);
			}
			return result;
		}
		function d1000(){
			return Math.floor(Math.random()*1000)+1;
		}
		function ageFromTable(table){
			var seed = d1000();
			var age = table[0]?0:15;
			for(; table[age] < seed && age< table.length; age++) {}
			return age;
		}
		function childGap() {
			var rolls = [d6(), d6()].sort((a,b)=>a-b);
			if(rolls[1] == 1) return 1;
			if(rolls[0] == 1) return d6();
			return rolls[0];
		}
		function person(birthYear){
			var person = {};
			person.birthYear = birthYear;
			person.ageAtDeath = ageFromTable(tables.ageAtDeath);
			person.ageAtInfertility = ageFromTable(tables.ageAtInfertility);
			person.sex = Math.random() < .5 ? "F":"M";
			return person;
		}
		
		function generateChildren(woman) {
			var ageAtChild = [explode6(2)+14];
			while(ageAtChild[0] < woman.ageAtInfertility && ageAtChild[0] < woman.ageAtDeath){
				ageAtChild.unshift(ageAtChild[0]+childGap());
			}
			return ageAtChild.map(age => person(woman.birthYear+age))
		}
		function main() {
			var grandmother = person(500);
			grandmother.ageAtDeath = Math.max(ageFromTable(tables.ageAtDeath),ageFromTable(tables.ageAtDeath),ageFromTable(tables.ageAtDeath),ageFromTable(tables.ageAtDeath));
			grandmother.sex = "F";
			var children = generateChildren(grandmother);
			children.forEach(c => console.log(c));
		}
	</script>

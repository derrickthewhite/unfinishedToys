<!DOCTYPE html>
<html>
<head>
	<title>GerryMander</title>
	<link href="main.css" rel="stylesheet">
	<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.4.1/knockout-debug.js"></script>
	<script type="text/javascript" src= "../../Tools/knockout-3.4.0.js"></script>
	<script type="text/javascript" src= "../../Tools/seededGenerator.js"></script>
	<script type="text/javascript" src= "config.js"></script>
	<script type="text/javascript" src= "game.js"></script>
	<script type="text/javascript" src= "view.js"></script>

	<script>
		function getRandomColor() {
			var letters = '0123456789ABCDEF';
			var color = '#';
			for (var i = 0; i < 6; i++) {
				color += letters[Math.floor(Math.random() * 16)];
			}
			return color;
		}
		function shuffleArray(a)
		{
			 var j, x, i;
			for (i = a.length - 1; i > 0; i--) {
				j = Math.floor(Math.random() * (i + 1));
				x = a[i];
				a[i] = a[j];
				a[j] = x;
			}
			return a;
		}
		function constituency (name,color,blocks){
			var constituency = {};
			
			constituency.name = name;
			constituency.color = color;
			constituency.blocks = ko.observableArray(blocks);
			
			constituency.canLoose = function(location){
				var blocks = constituency.blocks()
				var toRemove = blocks.filter(loc=>loc[0]==location[0] && loc[1]==location[1])[0]
				if(!toRemove)return false;
				var remaining = blocks.slice()
				remaining.splice(blocks.indexOf(toRemove),1);
				var connected = [remaining.pop()];
				
				while(remaining.length>0){
					
					var found = false;
					for(var i =0;i<remaining.length && !found;i++)
						for(var j =0;j<connected.length && !found;j++){
							var a = remaining[i];
							var b = connected[j]
							if((Math.abs(a[0]-b[0])==1 && a[1]==b[1]) 
								|| (Math.abs(a[1]-b[1])==1 && a[0]==b[0])){
								remaining.splice(i,1);
								connected.push(a);
								found = true;
							}
						}
					if(!found){
						return false;
					}
				}
				return true;
			}
			
			return constituency;
		}
		function square(x,y,party){
			var square = {};
			
			square.x = x;
			square.y = y;
			square.party = ko.observable(party);
			square.contents = ko.observableArray();
			
			return square;
		}
		function Party(name,icon){
			var party = {};
			party.name = name;
			party.icon = icon;
			party.momentum = ko.observable(0);
			party.staff = ko.observable(4);
			party.readyStaff = ko.observable(0);
			party.score = ko.observable(0);
			return party;
		}
		
		var root = {};
		function setup(){
			
			root.game = Game();
			var game = root.game;
			game.init();
			var view = View(game);
			root.view = view;
			return root;
		}
		
		function main (){
			var seed = Math.floor(Math.random()*10000);
			seed = 1031;
			Math.seedrandom(seed);
			console.log("seed",seed);
			setup();
			ko.applyBindings(root.view,document.getElementById('content'));
		}
	</script>
</head>
<body onload="main()">
	<div id = "content">
		<div id="actions">
			<h3 data-bind="text:game.currentParty() && game.currentParty().name"></h3>
			<span data-bind="text: game.governmentParty()?game.governmentParty().party: 'no one'"></span> is the government<br>
			turn: <span data-bind="text:game.turns"></span> <br>
			<button data-bind="click:gerryMander">Gerrymander!</button>
			<button data-bind="click:campaign">Campaign!</button>
			(<span data-bind="text:campaignCost"></span>)
			<button data-bind="click:zone">Zone!</button>
			<button data-bind="click:build">Build!</button>
			<button data-bind="click:redistrict">Redistrict!</button>
			<button data-bind="click:undo">Undo!</button>
			<button data-bind="click:endTurn">End Turn!</button>
			<select data-bind="options:possiblePartyChanges,optionsText:'name', value:currentPartyChange"></select>
			<select data-bind="options:possibleConstitChanges, optionsText:'name', value: currentConstitChange, color: currentConstitChange"></select>
			<select data-bind="options:possibleBuildings, value: currentZoning"></select>
		</div>
		<div id="key">
			<div data-bind="foreach:game.parties" class="parties">
				<div class="party">
					<span data-bind="text:name"></span>:
					<span data-bind="text:$root.game.totalVotes()[$data.name]"></span> ->
					<span data-bind="text:$root.game.partyPower()[$data.name].length"></span>
					(<span data-bind="text:momentum"></span>)
					<span data-bind="text:readyStaff"></span>/
					<span data-bind="text:staff"></span>:
					<span data-bind="text:score"></span>
				</div>
			</div>
			<div data-bind="foreach:game.constits">
				<div class="constitKey">
					<div data-bind="style:{'background-color':color}" class="constitBlock">
						<div data-bind="text:$root.game.constitSize()[$data.name]"></div>
						<div data-bind="text:$root.game.constitControl()[$data.name] && $root.game.constitControl()[$data.name].name"></div>
						<img data-bind="attr:{'src':$root.game.constitControl()[$data.name] && $root.game.constitControl()[$data.name].icon}" class="blockIcon"></img>
					</div>
					<div data-bind="text:name" class = "constitName"></div>
					<div data-bind="foreach:$root.game.parties" class ="voteTally">
						<span data-bind="text:name"></span>:
						<span data-bind="text:$root.game.election()[$parent.name] && $root.game.election()[$parent.name][$data.name]"></span><br>
					</div>
				</div>
			</div>
		</div>
		<div data-bind="foreach:blockDisplay" class="city">
			<div data-bind="foreach:$data" class="row">
				<div data-bind="click:$root.setCurrentBlock,
					css: {currentBlock: $root.currentBlock()==$data},
					style:{'background-color':$root.game.blockConstits()[$data.x][$data.y].color}" class="block">
					<div data-bind="text:party().name"></div>
					<!-- ko if:contents().filter(c=>c.name =="park").length == 0 -->
					<img data-bind="attr:{'src':party().icon}" class="blockIcon"></img>
					<!-- /ko -->
					<div data-bind="foreach:contents">
						<span data-bind="text:name"></span>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>

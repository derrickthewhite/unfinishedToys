<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seeded Triangle Region Edges</title>
<style>
  body {
    background: #ccc;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    background: #fff;
    border: 1px solid #000;
  }
</style>
</head>
<body>

<canvas id="canvas" width="1200" height="1200"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const CENTER = { x: W / 2, y: H / 2 };
const RADIUS = 520;

// --------------------
// Controls
// --------------------
const SECTIONS = 500;
const SEED = Math.floor(Math.random()*1000000)
//const SEED = 123456;

// --------------------
// Seeded RNG
// --------------------
function mulberry32(seed) {
  return function () {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);

// --------------------
// Geometry helpers
// --------------------
function equilateralTriangle(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * (2 * Math.PI / 3);
    pts.push({
      x: cx + Math.cos(a) * r,
      y: cy + Math.sin(a) * r
    });
  }
  return pts;
}

function pointInPolygon(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    const hit =
      ((yi > pt.y) !== (yj > pt.y)) &&
      (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
    if (hit) inside = !inside;
  }
  return inside;
}

function dist2(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return dx * dx + dy * dy;
}

// --------------------
// Setup
// --------------------
const triangle = equilateralTriangle(CENTER.x, CENTER.y, RADIUS);

// Generate random seeds inside triangle
const seeds = [];
while (seeds.length < SECTIONS) {
  const p = {
    x: CENTER.x + (rand() * 2 - 1) * RADIUS,
    y: CENTER.y + (rand() * 2 - 1) * RADIUS
  };
  if (pointInPolygon(p, triangle)) {
    seeds.push(p);
  }
}

// --------------------
// Region assignment buffer
// --------------------
const region = new Int16Array(W * H).fill(-1);

for (let y = 0; y < H; y++) {
  for (let x = 0; x < W; x++) {
    const idx = y * W + x;
    const pt = { x, y };

    if (!pointInPolygon(pt, triangle)) continue;

    let best = Infinity;
    let winner = 0;

    for (let i = 0; i < seeds.length; i++) {
      const d = dist2(pt, seeds[i]);
      if (d < best) {
        best = d;
        winner = i;
      }
    }
    region[idx] = winner;
  }
}

// --------------------
// Draw region edges
// --------------------
ctx.strokeStyle = "#000";
ctx.lineWidth = 1;
ctx.beginPath();

for (let y = 1; y < H - 1; y++) {
  for (let x = 1; x < W - 1; x++) {
    const idx = y * W + x;
    const r = region[idx];
    if (r === -1) continue;

    if (
      region[idx + 1] !== r ||
      region[idx - 1] !== r ||
      region[idx + W] !== r ||
      region[idx - W] !== r
    ) {
      ctx.moveTo(x, y);
      ctx.lineTo(x + 1, y);
    }
  }
}
ctx.stroke();

// --------------------
// Draw triangle outline
// --------------------
ctx.strokeStyle = "#000";
ctx.lineWidth = 2;
ctx.beginPath();
triangle.forEach((p, i) => {
  if (i === 0) ctx.moveTo(p.x, p.y);
  else ctx.lineTo(p.x, p.y);
});
ctx.closePath();
ctx.stroke();
</script>

</body>
</html>

      if (from !== to && !maze[from].includes(to)) {
        maze[from].push(to);
        addedConnections++;
      }
    }

    for (const room in maze) {
      maze[room].sort();
    }

    function analyzeDistances(start) {
      const distances = {};
      const queue = [[start, 0]];
      const sofar = new Set();
      while (queue.length > 0) {
        const [node, dist] = queue.shift();
        if (sofar.has(node)) continue;
        sofar.add(node);
        distances[node] = dist;
        for (const neighbor of maze[node]) {
          if (!sofar.has(neighbor)) {
            queue.push([neighbor, dist + 1]);
          }
        }
      }
      return distances;
    }

	}

	let entrances = Object.keys(maze).map(to => maze[to]).flat().reduce((counts, element) => {counts[element] = (counts[element] || 0) + 1; return counts;},{});

		unblockedExits: maze[key].length - Object.keys(blockedPortals[key]?blockedPortals[key]: []).length
	}))

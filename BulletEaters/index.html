<!DOCTYPE html>
<html>
<head>
	<title>Bullet Eaters</title>
	<link href="style.css" rel="stylesheet"></link>
	<!script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.4.0/knockout-min.js"></script-->
	<script type="text/javascript" src="../../tools/knockout-3.4.0.js"></script>
	<script type="text/javascript" src="../../tools/randomGenerators.js"></script>
	<script type="text/javascript" src="ztable.js"></script>
	<script type="text/javascript" src="nameGenerator.js"></script>
	<script type="text/javascript" src="units.js"></script>
	<script type="text/javascript" src="library.js"></script>
	<script type="text/javascript" src="battleground.js"></script>
	<script type="text/javascript" src="encounter.js"></script>
	<script type="text/javascript" src="map.js"></script>
	<script type="text/javascript" src="draw.js"></script>
	<script type="text/javascript" src="events.js"></script>
	<script type="text/javascript" src="teamNav.js"></script>
	<script type="text/javascript" src="mapNav.js"></script>
	<script>
		var results = {};
		results.config = {
			cellsHigh: ko.observable(1),
			cellsWide: ko.observable(1),

		/*
			cellsHigh: ko.observable(10),
			cellsWide: ko.observable(10),
			*/
			scale: ko.observable(25),
			aiTurnLength: ko.observable(1000),
		}
		var camera = {
			width: 500,
			height: 500,
			x: results.config.cellsWide() *100 -200,
			y: results.config.cellsHigh() *100 -200,
			scale: 100,
			moveX: 0,
			moveY: 0
		}
		function randNum(number) {
			Math.floor(Math.random() * number);
		}
		function createFaction (name,teams, structures) {
			var faction = {
				name: ko.observable(name),
				teams: ko.observableArray(teams),
				structures: ko.observableArray(structures),
				
			}
			return faction;
		}
		function main()
		{
			var config = results.config
			config.width = ko.pureComputed(() => config.cellsWide()*2-1);
			config.height = ko.pureComputed(() => config.cellsHigh()*2-1);
			
			results.library = buildLibrary();
			registerUnitStats();
			registerTeamNav();
			registerMapNav();
			
			results.map = createMap(config);
			
			var factionManager = {
				factions: [],
				factionNames: ["modern","Goblin", "Undead", "Monster" ]
			};
			//TODO: populate faction teams and structures properly... or remove them from object
			factionManager.factions = factionManager.factionNames.map(name => createFaction(name,[],[]))
			
			
			//TODO: populate diplomacy
			results.diplomacy = {
				factionRelations: {},
				teamRelations: {}
			}
			var diplomacy = results.diplomacy;
			diplomacy.getReaction = function (subjectTeam, objectTeam) {
				// TODO: apply this to the diplomacy screen
				if(subjectTeam.faction == "Monster") return "Hungery";
				if(subjectTeam.faction == "Undead") return "Hostile";
				if(subjectTeam.faction == "modern") return "Player Driven";
				if(subjectTeam.faction == "Goblin") {
					if(objectTeam.faction == "Monster") return "Hostile";
					if(objectTeam.faction == "Undead") return "Hostile";
					if(objectTeam.faction == "Modern") {
						if(factionManager.factions["Goblin"]["Modern"] === undefined) return "Wary";
						else return factionManager.factions["Goblin"]["Modern"];
					}
					if(objectTeam.faction == subjectTeam.faction ) return "Allied"
				}
			}
			
			results.message = ko.observable("Welcome to Bullet Eaters!");
			
			results.battleground = createBattleground();
			results.teamNavigation = createTeamNavigation();
			results.mapNavigation = createMapNavigation();
			results.encounterZone = createEncounterZone();
			
			var teamNav = results.teamNavigation;
			var base = copyStructure(results.library.structures.base);
			teamNav.homeTile = {
				contents: teamNav.teams().concat(base, copyStructure(results.library.structures.portal)),
				name: "home tile"
			};
			teamNav.homeTile.exploredFeatures = teamNav.homeTile.contents;
			base.featureMap["home tile"] = teamNav.homeTile.contents;
			// sticking the home tile in the feature map is hard!
			
			teamNav.homeTile.contents.find(item=>item.name()=="Portal").destination = results.map.initialTile;
			results.map.initialTile.contents.find(item=>item.name()=="Portal").destination = teamNav.homeTile;
			teamNav.teams().forEach(team => team.tile(teamNav.homeTile));
			var alphaTeam = teamNav.teams()[0]
			base.contents.push(copyUnit(results.library.units.conscript));
			base.contents.push(copyUnit(results.library.units.scout));
			base.contents.push(copyUnit(results.library.units.scout));
			base.contents.push(copyUnit(results.library.units.heavy));
			base.contents.push(copyUnit(results.library.units.officer));
			base.supply.addSupply("food",500);
			base.supply.addSupply("ammo",500);
			
			results.groupNavigation = {
				currentGroup: ko.observable(),
				units: ko.observableArray([]),
				gear: ko.observableArray([])
			}
			var groupNav = results.groupNavigation;
			groupNav.updateGroupDisplay = function () {
				if(groupNav.currentGroup()){
					groupNav.units(groupNav.currentGroup().contents.filter(feature => feature.featureType == "Unit"));
					groupNav.gear(groupNav.currentGroup().contents.filter(feature => feature.featureType == "Gear" || feature.featureType == "GearStack"));
				} else {
					groupNav.units([]);
					groupNav.gear([]);
				}
			}
			groupNav.transferUnit = function (unit){
				//make transfering conditional on diplomacy
				results.teamNavigation.currentTeam().units.push(unit);
				groupNav.currentGroup().contents = groupNav.currentGroup().contents.filter(a=> a!= unit);
				groupNav.updateGroupDisplay();
			}
			groupNav.unitActions = function (unit) {
				return [{
						name: "transfer",
						click: () => groupNav.transferUnit(unit)
				}];
			}
			groupNav.pickUp = function (object) {
				//make picking it up conditional on diplomacy
				results.teamNavigation.currentTeam().loot.push(object);
				groupNav.gear.remove(object);
				groupNav.currentGroup().contents = groupNav.currentGroup().contents.filter(item => item != object);
				groupNav.updateGroupDisplay();
			}
			
			ko.applyBindings(results,document.getElementById('main'));
			drawBigMap();
			drawMoveMap();
			attatchCanvasListeners();
			tick();
		}
		
	</script>
</head>
<body onload="main()">
	<div id= "main">
		<h2 data-bind="text:message"></h2>
		<div data-bind="if:battleground.active() && battleground.mode() != 'aiFight'">
			<div data-bind="with:battleground"  id = "battleground">
				<h1 data-bind="text:message"></h1>
				<div data-bind="text:mode"></div>
				<div data-bind="if:mode() != 'enemyTurn'">
					<button data-bind="click:allAttack">All Attack</button>
					<button data-bind="click:allRetreat">All Move Back</button>
					<button data-bind="click:allAdvance">All Move Forward</button>
				</div>
				<div data-bind="foreach:targetOptions()">
					<span data-bind="if:$data.length">
						<button data-bind="click:$parent.target, clickBubble:false">All foes at <span data-bind ="text:$data[0].distance()"></span></button>0
						<span data-bind="text:$root.battleground.attackOdds($root.battleground.currentUnit(),$root.battleground.currentWeapon(),$data) +'%'"></span>
					</span>
				</div>
				<div data-bind="foreach: attackers">
					<span>
						<unit-stats params="unit:$data, actions: $parent.attackerOptions()[$index()], style: '#000088'"/>
					</span>
				</div>
				<div data-bind="foreach: defenders">
					<unit-stats params="unit:$data, actions: $parent.targetUnitOptions($data), style: '#880000'"/>
				</div>
			</div>
		</div>
		<div data-bind="if: encounterZone.active">
			<div data-bind="with: encounterZone">
				<h3 data-bind="text:message"></h3>
				<h3 data-bind="text:question"></h3>
				<div data-bind="foreach:options">
					<button data-bind="text:text,click:click"></button>
				</div>
			</div>
		</div>
		<div data-bind = "if:!battleground.active() && !encounterZone.active()">
			<team-nav params="teamNav:teamNavigation,root:$data"></team-nav>
			<map-nav params="mapNav:mapNavigation,root:$data"></map-nav>
			<div data-bind="with:groupNavigation">
				<div data-bind="with:currentGroup">
					<h3 data-bind="text:name"></h3>
					<div data-bind="foreach:$parent.units">
						<unit-stats params="unit:$data, actions: $parents[1].unitActions($data), style: ''"/>
					</div>
					<div data-bind="foreach: $parent.gear">
						<div>
							<span data-bind="text:name"></span>
							<span data-bind="if:types.includes('weapon')">
								<!-- TODO: weapon types served more gracefully-->
								<span data-bind="text:weaponTypes.join(',')"></span>
								[<span data-bind="text:damage"></span>]
							</span>
							<button data-bind="click:$parents[1].pickUp">pick up</button>
						</div>
					</div>
					<div>Supplies:</div>
					<div data-bind="foreach: supply.getSupplies()">
						<div>
							<span data-bind="text:name"></span>
							:
							<span data-bind="text:amount"></span>
							<button data-bind="click:() =>$parent.supply.transferSupply(name,1,$root.teamNavigation.currentTeam().supply)">transfer</button>
							<button data-bind="click:()=>$parent.supply.transferSupply(name,5,$root.teamNavigation.currentTeam().supply)">transfer 5</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div id = "moveCanvasFrame">
		<!-- canvas only shrinks properly if placed inside a div and THAT is manipulated-->
		<canvas id = "moveMap" width="200" height="200"></canvas>
	</div>
		<div id = "canvasFrame">
		<!-- canvas only shrinks properly if placed inside a div and THAT is manipulated-->
		<canvas id = "bigMap" width="200" height="200"></canvas>
	</div>
</body>
</html>

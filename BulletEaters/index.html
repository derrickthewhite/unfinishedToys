<!DOCTYPE html>
<html>
<head>
	<title>Bullet Eaters</title>
	<link href="style.css" rel="stylesheet"></link>
	<!script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.4.0/knockout-min.js"></script-->
	<script type="text/javascript" src="../../tools/knockout-3.4.0.js"></script>
	<script type="text/javascript" src= "../../tools/seededGenerator.js"></script>
	<script type="text/javascript" src="../../tools/randomGenerators.js"></script>
	<script type="text/javascript" src="ztable.js"></script>
	<script type="text/javascript" src="nameGenerator.js"></script>
	<script type="text/javascript" src="units.js"></script>
	<script type="text/javascript" src="library.js"></script>
	<script type="text/javascript" src="battleground.js"></script>
	<script type="text/javascript" src="encounter.js"></script>
	<script type="text/javascript" src="map.js"></script>
	<script type="text/javascript" src="draw.js"></script>
	<script type="text/javascript" src="events.js"></script>
	<script type="text/javascript" src="teamNav.js"></script>
	<script type="text/javascript" src="mapNav.js"></script>
	<script type="text/javascript" src="groupNav.js"></script>
	<script>
		var results = {};
		results.config = {
			cellsHigh: ko.observable(10), // default is 10
			cellsWide: ko.observable(10), // default is 10

			scale: ko.observable(25),
			aiTurnLength: ko.observable(100),
		}
		var camera = {
			width: 500,
			height: 500,
			x: results.config.cellsWide() *100 -200,
			y: results.config.cellsHigh() *100 -200,
			scale: 100,
			moveX: 0,
			moveY: 0
		}
		var battleMapConfig = {
			scale: 30
		}
		function randNum(number) {
			Math.floor(Math.random() * number);
		}
		function createFaction (name,teams, structures) {
			var faction = {
				name: ko.observable(name),
				teams: ko.observableArray(teams),
				structures: ko.observableArray(structures),
				explorationMap: ko.observable(createExplorationMap())
			}
			return faction;
		}
		function main()
		{
			var seed = Math.random().toString(36).slice(2)
			//var seed = "g4pjzxtuprg"; // ooze
			//var seed = "ehvj4erertd"; // squidling
			//var seed = "l400phuzdy"; //goblin
			//var seed = "4tpoxs5p9i9"; //worms
			var seed = "fytb3jmyqkh"; //1x3 worm vs gob
			Math.seedrandom(seed);
			console.log("using", seed);
			var config = results.config
			config.width = ko.pureComputed(() => config.cellsWide()*2-1);
			config.height = ko.pureComputed(() => config.cellsHigh()*2-1);
			
			results.library = buildLibrary();
			registerUnitStats();
			registerUnitList();
			registerTeamNav();
			registerMapNav();
			registerGroupNav();
			registerBattleground();
			registerBattleReport();
			results.map = createMap(config);
			var map = results.map;
			
			var factionManager = {
				factions: [],
				factionNames: ["modern","Goblin", "Undead", "Monster", "Squidling", "None" ],
				currentFaction: ko.observable()
			};
			//TODO: populate faction teams and structures properly... or remove them from object
			factionManager.factions = factionManager.factionNames.map(name => createFaction(name,[],[]));
			results.factionManager = factionManager;
			
			//TODO: populate diplomacy
			results.diplomacy = {
				factionRelations: {},
				teamRelations: {}
			}
			var diplomacy = results.diplomacy;
			factionManager.factions.forEach(faction => {
				var result = {};
				diplomacy.factionRelations[faction.name()] = result;
				factionManager.factions.forEach(faction => result[faction.name()]="Wary");
			});
			factionManager.factions.forEach(faction => {
				diplomacy.factionRelations["Monster"][faction.name()] = "Hungery";
			});
			factionManager.getFaction = function (factionName) {
				return factionManager.factions.find(f => f.name() == factionName)
			}
			var perfectMap = 			{
				getStatus: ()=> "explored",
				setStatus: ()=>({}),
				features: (tileId) => {
					if(tileId.id) tileId = tileId.id;
					return results.map.index[tileId].contents;
				}
			}
			factionManager.getFaction("None").explorationMap(perfectMap);
			factionManager.currentFaction(factionManager.getFaction("modern"));
			results.factionManager = factionManager;
			diplomacy.getReaction = function (subjectTeam, objectTeam) {
				// possible reactions: "hungry", "hostile", "player driven", "wary", "allied"
				// TODO: apply this to the diplomacy screen
				// TODO: Player Driven determines fights, but not other interactions
				if(subjectTeam.faction() == "Monster") return "Hungery";
				if(subjectTeam.faction() == "Undead") return "Hostile";
				if(subjectTeam.faction() == "modern") return "Player Driven";
				if(subjectTeam.faction() == "Goblin" || subjectTeam.faction() == "Squidling") {
					if(objectTeam.faction() == "Monster") return "Hostile";
					if(objectTeam.faction() == "Undead") return "Hostile";
					if(objectTeam.faction() == "modern") {
						if(diplomacy.factionRelations[subjectTeam.faction()]["modern"] === undefined) return "Wary";
						else return diplomacy.factionRelations[subjectTeam.faction()]["modern"];
					}
					if(objectTeam.faction() == subjectTeam.faction() ) return "Allied"
					return "Hostile"
				}
			}
			
			results.trading = {};
			var tradNav = results.trading; 
			tradNav.offerGet = ko.observableArray([]);
			tradNav.offerGive = ko.observableArray([]);
			
			tradNav.addGet = function () {
				tradNav.offerGet.push(tradNav.selectedGet());
			}
			tradNav.addGive = function () {
				tradNav.offerGive.push(tradNav.selectedGive());
			}
			tradNav.removeGet = function (a) {
				tradNav.offerGet.remove(a);
			}
			tradNav.removeGive = function (a) {
				tradNav.offerGive.remove(a);
			}
			tradNav.selectedGive = ko.observable();
			tradNav.selectedGet = ko.observable();
			tradNav.giveOptions = ko.observableArray(["a","b","c"]);
			tradNav.getOptions = ko.observableArray(["x","y","z"]);
			
			results.message = ko.observable("Welcome to Bullet Eaters!");
			
			results.battleground = createBattleground();
			results.teamNavigation = createTeamNavigation();
			results.mapNavigation = createMapNavigation();
			results.encounterZone = createEncounterZone();
			
			var teamNav = results.teamNavigation;
			var base = copyStructure(results.library.structures.base);
			map.homeTile = {
				contents: teamNav.teams().concat(base),
				name: "home tile",
				stealth: () => 0,
				cover: () =>  0,
				id: "hometile"
			};
			
			createPassages("Portal", ["Portal", "Portal"], [map.initialTile, map.homeTile], "assets/portal.svg");
			teamNav.teams().forEach(team => team.tile(map.homeTile));
			var alphaTeam = teamNav.teams()[0]
			map.homeTile.contents.forEach( f  => alphaTeam.explorationMap().add("hometile", f))
			alphaTeam.explorationMap().share(factionManager.getFaction("modern").explorationMap());
			base.contents.push(copyUnit(results.library.units.conscript));
			base.contents.push(copyUnit(results.library.units.scout));
			base.contents.push(copyUnit(results.library.units.scout));
			base.contents.push(copyUnit(results.library.units.heavy));
			base.contents.push(copyUnit(results.library.units.officer));
			base.supply.addSupply("food",500);
			base.supply.addSupply("ammo",500);
			
			results.groupNavigation = createGroupNavigation();
			
			ko.applyBindings(results,document.getElementById('main'));
			results.artist = createArtist();
			results.artist.draw();
			results.artist.drawBattleMap();
			attatchCanvasListeners();
			tick();
	}
		
	</script>
</head>
<body onload="main()">
	<div id= "main">
		<h2 data-bind="text:message"></h2>
		<select data-bind="value: factionManager.currentFaction, options: factionManager.factions, optionsText: 'name'">
		</select>
		<div>
			<span>
				<team-nav params="teamNav:teamNavigation,root:$data"></team-nav>
				<span data-bind="if: encounterZone.active">
					<div class="navigationPane">
						<div class="panelLable">Encounter</div>
						<div data-bind="with: encounterZone">
							<h3>
								<span data-bind="text: message"></span>(<span data-bind="text:mood"></span>)
							</h3>
							<h3 data-bind="text:question"></h3>
							<div data-bind="foreach:options">
								<button data-bind="text:text,click:click"></button>
							</div>
							<div data-bind="if: showImage"><img data-bind="attr:{src:image}"></img></div>
						</div>
					</div>
				</span>
				<!-- ko if:battleground.active() && battleground.mode() != 'aiFight'-->
					<battle-ground params="battleground: battleground, root: $data"></battle-ground>
				<!-- /ko -->
				<span data-bind="visible:battleground.active() && battleground.mode() != 'aiFight'">
					<div id = "battleCanvasFrame" class="navigationPane">
						<div data-bind = "with: battleground" class="actionBar">
							<span data-bind="if: currentUnit">
								<span data-bind="foreach:moveOptions()[unitIndex(currentUnit())]">
									<!-- TODO: make this a component?-->
									<button data-bind="clickBubble:false, click:click">
										<span data-bind="if:svg">
											<img data-bind="attr:{src:svg, title: name}" class="smallIcon"></img>
										</span>
										<span data-bind="if: !svg">
											<span data-bind="text:name"></span>
										</span>
									</button>
								</span>
							</span>
						</div>
						<!-- canvas only shrinks properly if placed inside a div and THAT is manipulated-->
						<canvas id = "battleMap" width="200" height="200"></canvas>
					</div>
				</span>
				<map-nav params="mapNav:mapNavigation,root:$data"></map-nav>
				<!-- ko if: groupNavigation.currentGroup-->
					<group-nav params="groupNav: groupNavigation, root: $data"></group-nav>
				<!-- /ko -->
				<div class="navigationPane">
					<div class="panelLable">Diplomacy</div>
					<h3>Relationship Grid</h3>
					<table>
						<tr>
							<td></td>
							<!-- ko foreach: factionManager.factions -->
								<td data-bind="text: name"></td>
							<!-- /ko -->
						</tr>
						<!-- ko foreach: factionManager.factions -->
						<tr>
							<td data-bind="text: name"></td>
							<!-- ko foreach: $parent.factionManager.factions -->
								<td data-bind="text:$parents[1].diplomacy.factionRelations[$parent.name()][name()]"></td>
							<!-- /ko -->
						</tr>
						<!-- /ko -->
					</table>
				</div>
				<div class= "navigationPane">
					<div class="panelLable">Unit</div>
				</div>
				<!--div class="navigationPane">
					<div class="panelLable">Trade</div>
					<select data-bind="value: trading.selectedGive, options: trading.giveOptions">
					</select>
					<button data-bind="click: trading.addGive">Add</button>
					<select data-bind="value: trading.selectedGet, options: trading.getOptions">
					</select>
					<button data-bind="click: trading.addGet">Add</button>
					<div data-bind="foreach: trading.offerGive">
						<div>
							<span data-bind="text:$data">
							<button data-bind="click:$root.removeGive">Remove</button>
						</div>
					</div>
					<div data-bind="foreach: trading.offerGet">
						<div>
							<span data-bind="text:$data">
							<button data-bind="click:$root.removeGet">Remove</button>
						</div>
					</div>
				</div-->
				<!-- ko if:battleground.active() && battleground.mode() != 'aiFight'-->
					<battle-report params="battleground: battleground, root: $data"></battle-report>
				<!-- /ko -->
			</span>		
			<div id = "moveCanvasFrame" class="basicPane">
				<!-- canvas only shrinks properly if placed inside a div and THAT is manipulated-->
				<canvas id = "moveMap" width="200" height="200"></canvas>
			</div>
		</div>
	</div>
	<div id = "canvasFrame">
		<!-- canvas only shrinks properly if placed inside a div and THAT is manipulated-->
		<canvas id = "bigMap" width="200" height="200"></canvas>
	</div>
</body>
</html>

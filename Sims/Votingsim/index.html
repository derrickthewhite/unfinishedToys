<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Voting Sim</title>
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <h1>Voting Sim</h1>
          <p>Generate issues, voters, and candidates to test ranked-style election behavior.</p>
        </div>
      </header>

      <div class="panels">
        <section class="panel" id="generationPanel"></section>
        <section class="panel" id="saveLoadPanel"></section>
        <section class="panel" id="issuesPanel"></section>
        <section class="panel" id="candidatesPanel"></section>
        <section class="panel" id="votersPanel"></section>
      </div>
    </div>

    <div id="modalBackdrop" class="modal-backdrop hidden">
      <div class="modal-card" id="modalCard"></div>
    </div>

    <script type="module" src="js/app.js?v=2"></script>
  </body>
</html>

<html>
<head>
	<title>Combat Simulation</title>
	<script>
		var library;
		var DEBUG = false;
		function roll() {
			return Math.floor(Math.random()*6)+1;
		}
		function standardRoll() {
			var result =  roll() + roll() + roll();
			return result;
		}
		function smartRoll(name, target) {
			var result =  roll() + roll() + roll();
			if(DEBUG)console.log(name + ":" +result+ " vs " + target + (result <= target? " succeeded": " failed"));
			return result <= target;
		}
		function Damage() {
			var dam = {};
			dam.dice = 1;
			dam.modifier = 2;
			dam.roll = function () {
				var result = dam.modifier;
				for(var i = 0;i<dam.dice;i++) result += roll();
				return result;
			}
			return dam;
		}
		function Weapon (name, attackModes, defenseModes, modifiers, weight) {
			var weapon = {};
			weapon.name = name;
			weapon.attackModes = attackModes;
			weapon.defenseModes = defenseModes;
			weapon.modifiers = modifiers? modifiers : [];
			weapon.modifier = (stat) => weapon.modifiers.filter(mod => mod.applies == stat).reduce((sofar,a)=>sofar+a.modifier,0);
			weapon.weight = weight? weight: 0;
			weapon.withSkill = (skill) => {
				var result = Weapon(weapon.name, weapon.attackModes, weapon.defenseModes, weapon.modifiers);
				result.skill = skill;
				return result;
			}
			return weapon;
		}
		function WeaponMode (name, damageType, attackType, modifier, isSwing) {
			var weaponMode = {};
			weaponMode.name = name;
			weaponMode.damageType = damageType;
			weaponMode.attackType = attackType;
			weaponMode.modifier = modifier;
			weaponMode.isSwing = isSwing;

			return weaponMode;
		}
		function DefenseMode (name, defenseType, skillBonus, repeatPenalty, retreatBonus) {
			var defenseMode = {};
			defenseMode.name = name;
			defenseMode.defenseType = defenseType;
			defenseMode.skillBonus = skillBonus;
			defenseMode.repeatPenalty = repeatPenalty;
			defenseMode.retreatBonus = retreatBonus;
			return defenseMode;
		}
		function Attack(weaponMode,weapon,skill,ST) {
			var attack = {};
			attack.name = weaponMode.name
			attack.skill = skill;
			attack.weapon = weapon;
			attack.attackType = weaponMode.attackType;
			attack.damageType = weaponMode.damageType;
			attack.damage = DamageFromST(ST, weaponMode.isSwing);
			attack.damage.modifier += weaponMode.modifier;
			return attack;
		}
		function Defense(defenseMode, weapon, skill) {
			var defense = {};
			defense.name = defenseMode.name;
			defense.defenseType = defenseMode.defenseType;
			defense.defense = skill + defenseMode.skillBonus;
			defense.repeatPenalty = defenseMode.repeatPenalty;
			defense.retreatBonus = defenseMode.retreatBonus;
			return defense;
		}
		function DamageFromST (ST, isSwing) {
			var result = Damage();
			if(isSwing) {
				result.dice = Math.ceil(ST/4 -2);
				result.modifier = (ST+3)%4 -1;
			}
			else if (ST <=10) {
				result.dice = 1;
				result.modifier = -Math.ceil((14-ST)/2)
			}
			else {
				result.dice = Math.ceil((ST-10)/8);
				result.modifier = Math.ceil(((ST-10)%8)/2)-1;
			}
			return result;
		}
		function HitLocation(name, target, armor, wounding) {
			var hl = {};
			hl.name = name?name:"Default";
			hl.target = target?target:0;
			hl.wounding = wounding? wounding: Wounding();
			hl.armor = armor? armor: 0;
			hl.withArmor = (armor) => {return HitLocation(hl.name, hl.target, armor, hl.wounding)}
			return hl;
		}
		function Armor(name, location, DR, weight) {
			var armor = {};
			armor.name = name;
			armor.location = location;
			armor.DR = DR;
			armor.weight = weight;
			return armor;
		}
		function Wounding(imp,piHuge, piLarge, pi, piSmall, cut, cr, tox, bur, cor) {
			return {
				"Imp": imp?imp:2,
				"Pi++": piHuge?piHuge:2,
				"Pi+": piLarge?piLarge:1.5,
				"P": pi?pi:1,
				"P-": piSmall?piSmall:.5,
				"Cut":cut?cut:1.5,
				"Cr": cr?cr:1,
				"Tox": tox?tox:1,
				"Bur": bur?bur:1,
				"Corr": cor?cor:1
			};
		}
		function Status (name, effects, modifiers, recovery) {
			var status = {};
			status.name = name;
			status.effects = effects? effects: [];
			status.modifiers = modifiers? modifiers: [];
			status.canAct = () => status.effects.reduce((sofar, a)=> sofar && a.canAct, true);
			status.canDefend = () => status.effects.reduce((sofar, a)=> sofar && a.canDefend, true);
			status.defeated = () => status.effects.reduce((sofar, a)=> sofar || a.defeated, false);
			status.modifier = (stat) => status.modifiers.filter(mod => mod.applies == stat).reduce((sofar,a)=>sofar+a.modifier,0);
			status.recovery = recovery;
			return status;
		}
		function Recovery(possible, stat, modifier) {
			//TODO: time
			var recovery = {};
			recovery.possible = possible;
			recovery.stat = stat;
			recovery.modifier = modifier;
			return recovery;
		}
		function Effect (name, canAct, canDefend, permenant, defeated) {
			var effect = {};
			effect.name = name;
			effect.permenant = permenant;
			effect.canAct = canAct;
			effect.canDefend = canDefend;
			effect.defeated = defeated;
			return effect;
		}
		function Modifier (name, applies, modifier) {
			var mod = {};
			mod.name = name;
			mod.applies = applies;
			mod.modifier = modifier;
			return mod;
		}
		var warriorID = 1000;
		function Warrior(name, weapons, ST, HT, hitLocations) {
			var war = {};
			war.name = name;
			war.ID = warriorID++;
			war.ST = ST?ST:10;
			war.DX = 10;
			war.IQ = 10;
			war.HT = HT?HT:10;
			war.maxHP = ST?ST:10;;
			war.HP = ST?ST:10;;
			war.Per = 10;
			war.Will = 10;
			war.FP = 10;
			war.speed = 5;
			war.move = 5;
			war.shock = 0;
			war.defenses = [];
			war.attacks = [];
			war.weapons = weapons?weapons:[];
			war.hitLocations = hitLocations? hitLocations:[HitLocation()];
			war.statusList = [];
			war.canAct = (() => war.statusList.reduce((sofar, a) => a.canAct() && sofar, true));
			war.canDefend = (() => war.statusList.reduce((sofar, a) => a.canDefend() && sofar, true));
			war.defeated = (() => war.statusList.reduce((sofar, a) => a.defeated() || sofar, false));
			war.modifier = (stat) => war.statusList.map(status => status.modifier(stat))
				.concat(war.weapons.map(weapon => weapon.modifier(stat)))
				.reduce((a,b)=>a+b,0);
			war.reset = () => {
				war.statusList = [];
				war.HP = war.maxHP;
			}
			war.updateWeaponStats = () => {
				war.defenses = [];
				war.attacks = [];
				war.weapons.forEach(weapon => {
					var attackSkill = weapon.skill?weapon.skill:10;
					var defenseSkill = Math.floor(attackSkill/2)+3;
					weapon.attackModes.forEach( attackMode => {
						war.attacks.push(Attack(attackMode, weapon,attackSkill ,war.ST))
					})
					weapon.defenseModes.forEach( defenseMode => {
						war.defenses.push(Defense(defenseMode, weapon,defenseSkill))
					});
				});
			}
			war.bestDefense = () => {
				return war.defenses.sort((a,b) =>  b.defense - a.defense)[0];
			}
			war.encumbranceLevel = (penalty) => {
				return (war.ST*war.ST)/5 * (penalty <=2 ? (penalty+1) : penalty == 3? 1.2 : 2);
			}
			war.updateWeaponStats();
			return war;
		}
		function Team(name, warriors) {
			var team = {
				name: name,
				warriors : warriors
			};
			team.defeated = () => team.warriors.reduce((sofar,war) => sofar || war.defeated(), false);
			return team;
		}
		function calculateDeceptive(attackSkill, defenseSkill) {
			// returns negative value
			// TODO: exceptions with more analysis
			if(attackSkill <=9) return 2;
			if(attackSkill <=13) return 0;
			return Math.floor(6- attackSkill/2);
		}

		function attack(attacker, attack, defender, hitLocation, defense) {
			if(DEBUG)console.log(attacker.name+" attacks "+ defender.name+"'s " + hitLocation.name+" with "+ attack.name+ " vs " + defense.name);
			var result = {
				description: "miss",
				damage: 0,
				injury: 0
			};
			var attackerSkill = attack.skill + hitLocation.target-attacker.shock + attacker.modifier("attack");
			var defenderSkill = defense.defense + defender.modifier("defend");
			if(DEBUG)console.log("Attack", attackerSkill, "Defense", defenderSkill);
			var deceptive = calculateDeceptive(attackerSkill, defenderSkill);
			if(!smartRoll("attack",attackerSkill + 2 * deceptive)) return result;
			result.description = defense.defenseType
			if(smartRoll("defense:"+defense.defenseType, defenderSkill + deceptive)) return result;
			result.damage = Math.max(0, attack.damage.roll() - hitLocation.armor);
			//TODO: minimum 1 damage for non-crushing
			result.injury = Math.floor(result.damage * hitLocation.wounding[attack.damageType]);
			if(DEBUG)console.log(defender.name, "damage", result.damage, "injury", result.injury);
			result.description = result.damage? "Damaged": "Damage Resisted";
			if(DEBUG)console.log(result);
			return result;
		}
		attackOptionCalc={};
		function evaluateAttackOptions(attacker, defender) {
			var name = attacker.name+attacker.ID+"vs"+defender.name+defender.ID;
			if(attackOptionCalc[name])return attackOptionCalc[name];
			var options = [];
			for(var attackOption of attacker.attacks){
				for(var hitLocation of defender.hitLocations){
					options.push({attack: attackOption, hitLocation: hitLocation, name: attacker.name +" "+attackOption.name+ " "+ hitLocation.name +" " +defender.name, sampleDamage: 0});
				}
			}
			
			for(var option of options) {
				for(var i = 0;i<100;i++) {
					var damage = attack(attacker, option.attack, defender, option.hitLocation, defender.bestDefense());
					option.sampleDamage += damage.injury;
				}
			}
			attackOptionCalc[name]=options;
			return options;
		}
		function applyDamage(unit, attackResult) {
			if(attackResult.injury == 0)return "unharmed";
			var previousHP = unit.HP;
			unit.HP -= attackResult.injury;
			unit.shock = Math.min(4, attackResult.injury);
			if( unit.HP<= -unit.maxHP 
				&& Math.floor(previousHP/unit.maxHP) !== Math.floor(unit.HP/unit.maxHP) 
				&& standardRoll() > unit.HT + Math.floor(unit.HP/unit.maxHP)
			) {
				unit.statusList.push(library.status.Dead);
				return "Dead";
			}
			if(attackResult.injury > unit.maxHP/2 && standardRoll() > unit.HT && !unit.statusList.includes(library.status.KnockedDown)) {
				unit.statusList.push(library.status.KnockedDown);
				return "KnockedDown"; //TODO: inflict status 
			}
			if(DEBUG) console.log(unit.name + " at " + unit.HP);
			return "Injured";
		}
		function turn(unit, opponents){
			var result = "";
			if(unit.HP<=0 && standardRoll() > unit.HT) {
				unit.statusList.push(library.status.Unconscious);
				return "Unconscious";
			}
			if(unit.canAct()) {
				var target = opponents[0];
				var attackOption = evaluateAttackOptions(unit, target).sort((a,b) => b.sampleDamage - a.sampleDamage)[0];
				//var attackResult = attack(unit, unit.attacks[0], target, target.hitLocations[0], target.bestDefense());
				var attackResult = attack(unit, attackOption.attack, target, attackOption.hitLocation, target.bestDefense());
				result = applyDamage(target, attackResult);
			} else {
				if(DEBUG)console.log(unit.name+ " cannot act due to "+unit.statusList.map(status=>status.name));
				result = "cannot act!"
			}
			var statusToRemove = []
			for(var status of unit.statusList) {
				if(status.recovery.possible && smartRoll("recovery", unit[status.recovery.stat] + status.recovery.modifier)){
					statusToRemove.push(status);
					if(DEBUG)console.log(unit.name + " recovered from " + status.name);
				}
			}
			unit.statusList = unit.statusList.filter(status => !statusToRemove.includes(status));

			unit.shock =0;
			return result;
		}
		function combat(redTeam,blueTeam) {
			redTeam.warriors.forEach(war => war.team="red");
			blueTeam.warriors.forEach(war => war.team="blue");
			var combatants = redTeam.warriors.concat(blueTeam.warriors);
			for(var i = 0; i<10;i++){
				var u = Math.floor(Math.random() * combatants.length);
				var v = Math.floor(Math.random() * combatants.length);
				var temp = combatants[u];
				combatants[u] = combatants[v];
				combatants[v] = temp;
			}
			combatants.sort((a,b) => a.speed - b.speed);
			var count = 0;
			while (!redTeam.defeated() && !blueTeam.defeated()) {
				var combatant = combatants.shift();
				var foes = combatant.team == "red" ? blueTeam : redTeam;
				var result = turn(combatant,foes.warriors);
				if(DEBUG) console.log(result);
				combatants.push(combatant);
			}
			return redTeam.defeated()? blueTeam: redTeam;
		}
		function evaluate(a,b) {
			var results = [];
			results[a.name] = 0;
			results[b.name] = 0;
			for(var i = 0; i< 1000; i++) {
				var winners = combat(Team(a.name,[a]),Team(b.name,[b]));
				a.reset();
				b.reset();
				results[winners.name] = results[winners.name]? results[winners.name]+1: 1;
				if(DEBUG)console.log("v:", winners.name)
			}
			return results;
		}

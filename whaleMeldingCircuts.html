<html>
<head>
	<title>WhaleMelding</title>
	<script>
		var nextID = 1000; 
		function world(population){
			var world = {};
			world.id = nextID++;
			world.population = population;
			return world;
		}
		
		function connection(a,b,time){
			var conn = {};
			conn.a = a;
			conn.b = b;
			conn.time = time;
			return conn;
		}
		
		
	</script>
</head>
<body>
	<div id = "content"></div>
</body>
</html>
